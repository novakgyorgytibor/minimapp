# Hetente frissíti a magyarországi traffipaxlistát az OpenStreetMapből (website/ → Vercel; src/data/ → következő app build)
name: Speed cameras

on:
  schedule:
    - cron: '17 3 * * 1' # hétfő 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-speed-cameras.mjs
      - name: Commit if changed
        run: |
          # Csak a dátum változott → nincs commit
          if git show HEAD:website/speed-cameras-hu.json > /tmp/old.json 2>/dev/null && node -e "
            const f = (p) => JSON.stringify(JSON.parse(require('fs').readFileSync(p, 'utf8')).cameras);
            process.exit(f('/tmp/old.json') === f('website/speed-cameras-hu.json') ? 0 : 1);
          "; then
            echo "No camera changes"; git checkout -- website src/data; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add website/speed-cameras-hu.json src/data/speedCameras.json
          git commit -m "chore: update speed cameras from OpenStreetMap"
          git push
